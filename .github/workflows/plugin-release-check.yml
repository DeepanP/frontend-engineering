name: Plugin Release Check

on:
  pull_request:
    paths:
      - ".github/plugin/**"
      - "plugins/frontend-engineering/**"
      - "scripts/**"
      - "CHANGELOG.md"
  push:
    branches: [main]
    paths:
      - ".github/plugin/**"
      - "plugins/frontend-engineering/**"
      - "scripts/**"
      - "CHANGELOG.md"

permissions:
  contents: read

jobs:
  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate plugin version and marketplace source
        run: python3 scripts/validate-plugin-version.py
      - name: Run release structure checks
        run: python3 scripts/release-check.py
